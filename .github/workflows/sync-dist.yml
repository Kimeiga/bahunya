name: Sync dist

on:
  push:
    branches: [fix/desktop-dropdown-density]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - run: npm test
      - name: Commit generated CSS
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/bahunya.css dist/bahunya.min.css
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate distribution CSS"
            git push
          fi
